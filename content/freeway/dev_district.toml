# The Proving Grounds (`freeway/dev`, PLAN.md §9 M2, D16): a 256 m district that is both the fast
# fixture for tests and the engine's urban tech demo. Each area has a sign naming the system it
# exercises and the `gtf` command that checks it. Same format as district.toml.

name = "The Proving Grounds"
cell = 16.0
origin = [-128.0, -128.0]
seed = 7

map = '''
-------==-------
-cccccc==rrrrrr-
-cccccc==rrrrrr-
-cccccc==rrrrrr-
-------==-------
-PPPPPP==gggggg-
-PPPPPP==gggggg-
================
================
-VVVVVV==hhhhhh-
-VVVVVV==hhhhhh-
-VVVVVV==hhhhhh-
-VVVVVV==-------
-VVVVVV==mmmmmm-
-VVVVVV==mmmmmm-
-------==-------
'''

[legend]
"c" = { zone = "shops" }
"r" = { zone = "range" }
"P" = { zone = "lot" }
"g" = { zone = "park" }
"V" = { zone = "pad" }
"h" = { zone = "yard" }
"m" = { zone = "missions" }
"-" = { road = "street" }
"=" = { road = "avenue" }

# Facade materials by building style (windows that light up at night; `podium` for towers' podiums).
[facades]
tower_glass = "MAT/gtf/glass_curtain"
tower_concrete = "MAT/gtf/office_concrete"
podium = "MAT/gtf/office_concrete"
stucco_shop = "MAT/gtf/stucco_windows"
apartment = "MAT/gtf/stucco_windows"
bungalow = "MAT/gtf/stucco_windows"
warehouse = "MAT/gtf/brick_windows"

[zones.shops]
ground = "concrete"
styles = ["stucco_shop", "apartment"]
lot = [10.0, 18.0]
depth = 24.0
height = [5.0, 11.0]
props = { lamp = 1.0, palm = 4.0, bench = 1.5, bin = 2.0, hydrant = 1.0 }

[zones.range]
ground = "concrete"
props = { lamp = 1.0 }

[zones.lot]
ground = "asphalt"
props = { lamp = 1.0 }

[zones.park]
ground = "grass"
props = { lamp = 1.0, tree = 3.0, bench = 2.0, bin = 1.0 }

[zones.pad]
ground = "asphalt"

[zones.yard]
ground = "asphalt"
props = { lamp = 1.0 }

[zones.missions]
ground = "plaza"
props = { lamp = 1.0, bench = 1.0 }

[[landmark]]
key = "police"
name = "SPPD Training"
cells = [[11, 9], [14, 10]]
assembly = "police"
height = 9.0
blip = "police"

# A kicker for jumps and a long incline for slopes on the vehicle pad.
[[jump]]
at = [5.0, 10.0]
yaw = 0.0
length = 12.0
width = 5.0
height = 2.2
name = "kicker"

[[jump]]
at = [2.5, 12.0]
yaw = 0.0
length = 30.0
width = 6.0
height = 3.0
name = "incline"

[[sign]]
at = [8.0, 6.6]
text = "SIGNALS & TRAFFIC\ngtf citymap layers=lanes,signals"
color = "#1b1f24"

[[sign]]
at = [5.6, 4.0]
text = "STREETS & STREAMING\ngtf perf view=hills_vista"
color = "#1b1f24"
# (Above the facades and the trees: the letters read against the sky.)
height = 9.0

[[sign]]
at = [11.0, 4.6]
text = "COVER RANGE\ngtf citymap layers=cover"
color = "#1b1f24"

[[sign]]
at = [12.0, 6.6]
text = "PEDESTRIANS & CROSSWALKS\ngtf citymap layers=walk"
color = "#1b1f24"
# (Above the facades and the trees: the letters read against the sky.)
height = 9.0

[[sign]]
at = [3.5, 4.6]
text = "PARKING\ngtf citymap layers=parking"
color = "#1b1f24"

[[sign]]
at = [3.5, 8.6]
text = "VEHICLE FEEL PAD\ngtf vehicle_feel"
color = "#1b1f24"

[[sign]]
at = [6.6, 10.0]
text = "STUNT JUMP\ngtf vehicle_feel key=okami_kaze"
color = "#1b1f24"

[[sign]]
at = [12.5, 11.6]
text = "HEAT DISPATCH\ngtf play cmd=\"wanted 3\""
color = "#1b1f24"

[[sign]]
at = [10.5, 13.4]
text = "MISSIONS\ngtf play cmd=\"mission start dev_test\""
color = "#1b1f24"

[[sign]]
at = [13.0, 13.4]
text = "UI GALLERY\ngtf capture scene=freeway/gallery hud=true"
color = "#1b1f24"

[[sign]]
at = [12.0, 14.6]
text = "AUDIO & RADIO\ngtf audio_capture"
color = "#1b1f24"

[[sign]]
at = [12.5, 2.2]
text = "COMBAT & WEAPONS\ngtf input cmd=\"give p9 60\" hold=l2 press=r2"
color = "#1b1f24"

