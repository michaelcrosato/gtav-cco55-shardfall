# Weather: how each state changes the time of day's look, how long it lasts (game hours) and
# what may follow it (weights).
[weather.clear]
hours = [6.0, 14.0]
next = { clear = 3.0, hazy = 3.0, overcast = 2.0, fog = 1.0 }

[weather.hazy]
clouds = 0.1
fog = 0.75
light = 0.92
saturation = 0.92
haze = 0.12
hours = [4.0, 10.0]
next = { clear = 3.0, overcast = 2.0 }

[weather.overcast]
clouds = 0.85
cloud = "#9aa1a8"
fog = 0.8
light = 0.55
saturation = 0.8
hours = [3.0, 8.0]
next = { clear = 2.0, rain = 3.0, hazy = 1.0 }

[weather.rain]
clouds = 0.95
cloud = "#6f767e"
fog = 0.55
light = 0.4
saturation = 0.72
rain = 1.0
wind = 4.0
hours = [2.0, 5.0]
next = { overcast = 3.0, storm = 1.5, clear = 1.0 }

[weather.storm]
clouds = 1.0
cloud = "#4d535b"
fog = 0.45
light = 0.28
saturation = 0.65
rain = 2.2
wind = 9.0
lightning = 0.12    # flashes per second
hours = [1.0, 3.0]
next = { rain = 3.0, overcast = 1.0 }

[weather.fog]
clouds = 0.5
cloud = "#b8bec4"
fog = 0.22
light = 0.6
saturation = 0.78
hours = [2.0, 5.0]
next = { clear = 2.0, hazy = 2.0 }
