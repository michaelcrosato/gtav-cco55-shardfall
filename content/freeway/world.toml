hour = 17.8
sun = { color = "#ffc27a", intensity = 1.2 }
sky = { zenith = "#4a72b0", horizon = "#f5c99a", ground = "#6b5240", glow = "#ffbf75", clouds = 0.25, cloud = "#ffe0bd" }
ambient = { sky = "#9aa6c4", ground = "#80604a", level = 0.8 }
fog = { color = "#efcfa8", start = 200.0, end = 1100.0 }
