sky = { zenith = "#3d74c2", horizon = "#bcd4e8", ground = "#6b5c4c", glow = "#fff0d6", clouds = 0.25, cloud = "#ffffff" }
ambient = { sky = "#93acd0", ground = "#7a6a58", level = 0.82 }
fog = { color = "#c3d6e6", start = 220.0, end = 1150.0 }
