# Time of day and weather (PLAN.md §5.6.12, §5.11). The clock runs `day_length` real seconds per
# 24 game hours; the look blends between the presets around the hour, then the weather changes it.
# Colours are sRGB hex. Sun and moon directions come from the hour (east at dawn, west at dusk);
# a preset sets their colour and strength.

day_length = 2880.0     # 48 real minutes per game day
start = "17:40"         # a new game starts in the golden hour
latitude = 34.0         # how high the sun climbs (degrees north)

# The picture: every surface lit, no outlines, a filmic curve and a little bounce light — the
# sun-bleached, hazy realism of the source rather than a cartoon.
[look]
style = "lit"
outlines = false
tonemap = "aces"
gi = 0.6

[[preset]]
name = "late_night"
hour = 2.5
sun = { color = "#2d3550", intensity = 0.0 }
moon = { color = "#8fa3c8", intensity = 0.22 }
sky = { zenith = "#050a17", horizon = "#152038", ground = "#0d0f14", glow = "#1c2740", stars = 1.0, clouds = 0.15, cloud = "#1d2536" }
ambient = { sky = "#26324c", ground = "#14161c", level = 0.42 }
fog = { color = "#152038", start = 160.0, end = 900.0 }
exposure = 1.35
bloom = 0.65
temperature = -0.35
saturation = 0.9
street_lights = 1.0
windows = 0.45

[[preset]]
name = "dawn"
hour = 5.9
sun = { color = "#ff9a6a", intensity = 0.45 }
moon = { color = "#8fa3c8", intensity = 0.05 }
sky = { zenith = "#2c3f6b", horizon = "#f1a37c", ground = "#3a2e2a", glow = "#ffb68a", stars = 0.25, clouds = 0.3, cloud = "#f4b59a" }
ambient = { sky = "#7f86a8", ground = "#5a463c", level = 0.62 }
fog = { color = "#e7a98e", start = 140.0, end = 900.0 }
exposure = 1.2
