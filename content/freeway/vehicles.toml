# Grand Theft Freeway-BX vehicle archetypes (PLAN.md §5.6.3, §6.8.2), read by
# `gtf_game::vehicles` and spawned with `vehicles::spawn(sim, key, feet, yaw, paint)`.
#
# Each table is the engine's `pav_core::vehicle::VehicleDef` (docs/REFERENCE.md, "Vehicles"; `body` and
# `wheel` name the body and wheel props in LIB/gtf_vehicles, `accent` their `$pillar` colour; a
# helicopter's body spins its `rotor` and `tail_rotor` groups)
# plus the game's own fields: `name`, `colors` (paint picked per copy; the body prop's `$accent`
# parts), `traffic_weight` (share of ambient traffic) and `sound` (engine cue family).
#
# Positions are in the body frame, metres: the ground under the centre at rest is the origin, +z
# the front, +x the vehicle's own LEFT (the driver's side). `size` is the body collider's half
# extents, its bottom `clearance` above the ground; `com` the centre of mass from the collider's
# centre. Handling: `power` N per driven wheel at low speed, constant power above `knee` × top
# speed, the engine fading over the last 8% of `max_speed`; `brake` N in total (60% front);
# `grip` the tyres' friction coefficient (≈ cornering g), `drift_grip` the rear tyres' while the
# handbrake locks them; `steer` degrees of lock below 8 m/s, `steer_at_top` the share left at top
# speed. Feel targets and how they are measured: `gtf vehicle_feel`, crates/gtf_game/tests/vehicles.rs.
# `health`: a crash costs about 45 per m/s of impact beyond 2.5 m/s (a car meeting a wall at
# 50 km/h loses a fifth of 2500); it smokes below 40% and burns below 10%.

