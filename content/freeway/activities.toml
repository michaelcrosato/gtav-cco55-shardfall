# ---- Random events ----

# Met in the street outside missions, not too often: each is checked every few seconds once free
# roam has gone `after` seconds without an event (since the last one, or the start), where it
# fits, with `chance` of happening at each check. `kind` says which it is.

# A thief snatches a purse from someone near the player (on foot, where `crowd` people are
# within 30 m in one of the `zones`) and runs (`run` m/s, slower after `tire` s; `escape` m off
# and gone). One hit takes them down and the purse drops: walk over it, then give it back (D-pad
# right by its owner: `reward`) or keep it (walk 60 m off with it: `keep`). Done either way.
[[event]]
id = "purse_snatcher"
kind = "snatch"
title = "Purse Snatcher"
after = 150.0
chance = 0.35
zones = ["commercial", "downtown", "shops", "beach", "park"]
crowd = 6
reward = 150
keep = 320
run = [5.4, 4.2]
tire = 10.0
hp = 25.0
escape = 85.0
wait = 120.0
speaker = "PASSER-BY"

[event.lines]
snatch = "Hey! My purse! Somebody stop him!"
thanks = "My purse! Oh, thank you, thank you!"
kept = "Hey! That's mine!"
gone = "He got away..."

# A robber outside a shop (`near`: the doors; the player in a car `reach` m off) begs for a
# ride: stop by them and they get in, with `stars` on the player. Lose the police, then drop them
# at one of the `drops` (`drop` m from the shop) for `reward`. They wait `wait` s for a ride; out
# of the car they follow the player into the next one, but not from `escape` m behind.
[[event]]
id = "getaway_needed"
kind = "getaway"
title = "Getaway Needed"
after = 150.0
chance = 0.35
near = ["landmark:gas", "landmark:grind_house", "landmark:diner", "landmark:gun_store"]
reach = [40.0, 150.0]
drops = [
  "spot:dez_beach", "spot:roxy_flats", "spot:impound_lot", "spot:depot_gate",
  "spot:cityworks_gate", "spot:diner_lot", "spot:luxe_front",
]
drop = [250.0, 800.0]
stars = 2
reward = 1200
run = [5.2, 4.6]
escape = 60.0
wait = 75.0
speaker = "ROBBER"

[event.lines]
beg = "Hey! You! I need a ride, now!"
board = "Go, go, go! They're right behind me!"
heat = "Lose the cops first!"
wait = "Hey, wait for me!"
thanks = "Nice driving. Here's your cut."
gone = "Forget it, I'll find another ride."

[event.look]   # a dark hoodie and a cash-stuffed sweat
skin = ["#f1c9a5", "#e0ac83", "#c68e62", "#a26a42", "#7a4b2a"]
shirt = ["#1f1f24", "#2b2b30", "#30242a"]
pants = ["#1d2430", "#2a2a2a"]
shoes = ["#111111", "#2a2a2a"]
