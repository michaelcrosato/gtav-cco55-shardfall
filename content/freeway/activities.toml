# Grand Theft Freeway-BX activities (PLAN.md §5.6.11), read by `gtf_game::activities`. The
# Pretzel Run and the hold-ups are missions with `activity = true` (missions/). Here: the stunt
# jumps (`[[jump]]`), the Lost Shields (`[[shield]]`), vigilante (`[vigilante]`) and the random
# events (`[[event]]`). Each finished one counts toward completion.

# ---- Stunt jumps ----
# Through the `gate` (world x, z: a ramp's lip, a road's broken end) at `speed` m/s or more,
# heading `heading` (degrees from north), then airborne; down inside `land` (radius `radius`)
# is the bonus. The ramps are `[[jump]]` wedges in district.toml. `runup` is where a run at it
# starts (bots, the attract mode, tests).

