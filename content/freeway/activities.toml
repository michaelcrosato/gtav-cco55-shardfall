# ---- Vigilante ----

# In a police car, D-pad right (keyboard E) or the phone's Jobs app starts it. Each level sends
# suspects in getaway cars somewhere near; they drive about until the police car comes within
# `spot` m (or its siren within twice that, or a hit), then run (`escape` m off, or well clear a
# while, they think they have lost it and pull over). Ram or shoot a getaway car down
# to `bail` of its health (a ram does `ram` times the crash's own damage to it) or box it in, and
# they jump out and run on foot (unarmed) or fight (`armed` levels, as the `side` of
# enemies.toml); a suspect down — or burnt out in the car — is a takedown, paying `pay`. The last
# level done pays `bonus` and counts for completion; a civilian killed on duty docks `fine` (the
# police do not come after one of their own for it). It ends on death, arrest, a time limit run
# out, a suspect on foot getting away, or `leave` seconds out of a police car (not while chasing
# a suspect on foot).
[vigilante]
title = "Vigilante"
cars = ["sppd_interceptor", "sppd_tactical"]
pay = 250
bonus = 1000
fine = 250
leave = 60.0
spawn = [60.0, 120.0]
spot = 45.0
escape = 320.0
hide = 70.0
bail = 0.2
ram = 3.0
tough = 0.5
gap = 4.0
hp = 30.0
armed_hp = 50.0
run = [4.8, 3.4]
tire = 6.0
side = "street"

[vigilante.look]   # hoodies and dark denim
skin = ["#f1c9a5", "#e0ac83", "#c68e62", "#a26a42", "#7a4b2a", "#4f3220"]
shirt = ["#26262b", "#3b2f2f", "#2f3b4a", "#4a3b24", "#5a1f24", "#1f3a2a"]
pants = ["#1d2430", "#2a2a2a", "#3a3a40", "#20304a"]
shoes = ["#111111", "#2a2a2a", "#e6e6e6"]

[[vigilante.level]]
