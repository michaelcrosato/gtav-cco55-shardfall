# Grand Theft Freeway-BX armed opponents (PLAN.md §5.6.4), read by `gtf_game::enemies`: who they
# are, how they look, what they carry and how they fight. Missions spawn them by side
# (`enemies <n> <side>` in tests and the console).
#
# `prefix` names their entities (`gang:…`, `guard:…`; guards have 150 health with armour, others
# 100). `weapons` are ids from weapons.toml, one picked per person. `accuracy` is the chance a shot
# hits at point blank (falling off with distance, the player's speed and cover); `damage` the
# share of the weapon's damage that reaches the player; `retreat` the share of health below which
# they fall back (0: they hold their ground); `grenades` how many each carries.

[side.gang]
name = "Ditch Kings"
prefix = "gang"
weapons = ["p9", "p9", "buzz", "pump"]
accuracy = 0.45
damage = 0.4
retreat = 0.35
grenades = 0
skin = ["#f1c9a5", "#e0ac83", "#c68a62", "#8d5a3b", "#6b4428"]
shirt = ["#2e6b3f", "#244f30", "#3b7d4a", "#1f1f24"]
pants = ["#1d1d22", "#2b2b30", "#3a3f4a"]
shoes = ["#111111", "#ededed"]
height = [1.65, 1.9]
build = [0.95, 1.25]

[side.guard]
name = "Ironclad Security"
prefix = "guard"
weapons = ["p9", "c4r"]
accuracy = 0.55
damage = 0.4
retreat = 0.0
grenades = 1
skin = ["#f1c9a5", "#e0ac83", "#c68a62", "#8d5a3b", "#6b4428"]
shirt = ["#3a3f47"]
pants = ["#22262c"]
shoes = ["#111111"]
height = [1.75, 1.95]
build = [1.1, 1.35]
