pants = ["#1d1d22", "#2b2b30", "#3a3f4a"]
shoes = ["#111111", "#ededed"]
height = [1.65, 1.9]
build = [0.95, 1.25]
wear.hair = { buzz = 3, short = 2, curly = 1, afro = 0.4, bald = 1, ponytail = 0.3 }
