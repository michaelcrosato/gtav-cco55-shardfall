# Reference views (PLAN.md §7.2): `load scene=freeway/view/<name>` puts a still camera here, with
# streaming around it, at the view's time of day and weather. `gtf perf view=all` measures each;
# captures of them are the look check. Positions are world metres (x east, y up, z south).

[[view]]
name = "downtown_street"
about = "Street level by the bank plaza, looking east along the street to the avenue"
