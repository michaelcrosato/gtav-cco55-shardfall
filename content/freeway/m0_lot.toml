# M0 placeholder level (PLAN.md §9 M0): a parking lot to prove the game runs in every build
# target. The generated Paloma Bay district replaces it in M2. A room file: every field is
# documented in rooms/_template.toml. Column = x (east), row = z (south), 1 cell = 1 m.

name = "Paloma Bay (bootstrap lot)"
about = "A placeholder parking lot while the city is built."
entrance = { at = [20, 12], facing = "south" }   # required by the format; `P` is the start

[camera]
tilt = 25.0
distance = 9.0

[layout]
origin = [-20.0, 0.0, -12.0]

[[layout.layer]]
y = 0
map = '''
########################################
#......................................#
#..=..=..=..=..=..=......=..=..=..=....#
#......................................#
#.......ooooo...............ooooo......#
#......................................#
#..=..=..=..=..=..=......=..=..=..=....#
#......................................#
#......................................#
#...................P..................#
#......................................#
#..=..=..=..=..=..=......=..=..=..=....#
#......................................#
#.......ooooo...............ooooo......#
#......................................#
#..=..=..=..=..=..=......=..=..=..=....#
#......................................#
########################################
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c2e33" }]

[layout.legend.'=']
blocks = [{ y0 = -0.5, y1 = 0.01, color = "#e8e4d8" }]

[layout.legend.'o']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c2e33" }, { y0 = 0, y1 = 0.45, color = "#9a9a96", rounded = true }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c2e33" }, { y0 = 0, y1 = 1.1, color = "#f2c6a0" }]

[layout.legend.'P']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c2e33" }]
marker = "player"
