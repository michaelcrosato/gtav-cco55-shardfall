# Hold-up: the Grind House (PLAN.md §5.6.11). Up to the counter, a gun on the barista until the
# bag is full (closer is quicker), out of the door into two stars, into the getaway car
# outside, then lose them. Whoever is played.

key = "act_holdup_grind"
title = "Hold-up: The Grind House"
protagonist = ""
activity = true
text = "The Grind House charges nine dollars a latte. Time to collect."
blip = { icon = "activity", at = "at:179,-254" }
unlock = ["m1_repo_man"]

[[medals]]
id = "fast"
text = "In and clear within 2:00"
time_under = 120.0

[[medals]]
id = "unhurt"
text = "Finish with three quarters of your health"
health_over = 0.75

[[spawn]]
id = "clerk"
ped = "local"
at = "spot:grind_clerk"
behaviour = "idle"
name = "Barista"

# The getaway car, outside the door.
[[spawn]]
id = "getaway"
vehicle = "okami_kaze"
at = "at:182,-246.7"
yaw = 270.0
paint = 2
blip = "vehicle"
name = "Getaway"

[[step]]
kind = "goto"
target = "spot:grind_counter"
radius = 2.5
objective = "Walk up to the ~y~counter~s~."

[[step]]
kind = "holdup"
target = "actor:clerk"
seconds = 6.0
objective = "Aim at the ~r~barista~s~ until the bag is full."
help = "Hold ~btn:l2~ to aim. Closer fills the bag faster."
on_done = [{ loot = [300, 900] }]

[[step]]
kind = "goto"
target = "at:179,-254"
radius = 3.0
objective = "Get ~y~out~s~ with the bag."
on_done = [{ heat = 2 }, { heat_cap = 2 }]

[[step]]
kind = "enter_vehicle"
target = "actor:getaway"
objective = "Get in the ~b~getaway car~s~."

[[step]]
kind = "lose_heat"
stars = 0
objective = "Lose the ~b~cops~s~."
