# h1 The Freeway Job (PLAN.md §5.7): the heist, played as the approach picked on the board (h0
# keeps `loud` or `smart`). LOUD: Roxy blocks Route 404 with the City Works truck, Mack breaches
# the Ironclad truck and the crew grabs the bags and holds off the SWAT; Dez takes the Okami Kaze
# off the Harbor Spur's broken end onto the harbor road and loses the police. SMART: Roxy's fake
# roadwork sends the truck to a harbor warehouse, Dez tails it there in a city truck, Mack swaps
# the cargo, and Mack drives out in a hard hat, one star at most. Every switch is the story's.

key = "h1_freeway_job"
title = "The Freeway Job"
protagonist = "roxy"
text = "Thursday, nine sharp. The Freeway Job."
contact = "mack"
blip = { letter = "H", at = "spot:mack_home" }
start = "deck:458,-24"
unlock = ["h0_board"]
time = { at = "21:00", lock = true }
weather = "clear"
reward = { cash = 0, text = ["mack", "Thursday, we were legends. Friday, we're three people who've never met. Spend it slowly."] }
names = { guard = "GUARD" }

[[medals]]
id = "fast"
text = "Finish within 8:00"
time_under = 480.0

[[medals]]
id = "tough"
text = "Finish with half your health or more"
health_over = 0.5

