# m2 Midlife Crisis (PLAN.md §5.7): Mack sells his success course outside the Freeway Diner, the
# buyer turns out to be a Ditch Kings collector, and the deal goes bad: a brawl, a shootout on
# Sunset Row, then two stars to lose. Teaches cover, aiming, the weapon wheel and heat evasion.

key = "m2_midlife"
title = "Midlife Crisis"
protagonist = "mack"
text = "A buyer for Mack's course. What could go wrong?"
contact = "dez"
blip = { letter = "M", at = "spot:mack_diner" }
start = "spot:m2_start"
unlock = ["m1_repo_man"]
time = { at = "19:10", lock = true }
weather = "clear"
reward = { cash = 2000, text = ["roxy", "Heard Sunset Row got loud. Was that you, old man? I've got a job that needs loud. Pier, tomorrow. - R"] }
names = { rex = "REX", thug = "THUG" }

[[medals]]
