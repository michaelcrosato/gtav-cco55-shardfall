# Pedestrians (PLAN.md §5.6.7): who walks Paloma Bay, how they look and move, where and when.
# A look is drawn from the archetype's palettes and proportions (each archetype gives dozens of
# distinct people); walks and idles are motion clips (the `clips` tool lists them); `pace` is the
# walking speed in m/s; `zones` lists where an archetype appears (empty: everywhere).
# `wear` is what they wear beyond the clothes' colours (gtf_game::looks::Wear, PLAN.md §6.8.4):
# `hair` weights by style (buzz, short, long, bun, ponytail, curly, afro, bald, none; empty: a
# mix of them all) and `hair_color` its palette (empty: natural colours); `beard` the chance of
# each style (stubble, mustache, goatee, full), a quarter as likely with long or tied-back hair;
# `accessories` the chance of each: headwear (ballcap, beanie, hardhat, helmet, hood: at most
# one; a hood is the shirt's colour), sunglasses, a bag (backpack, shoulder_bag: at most one),
# badge, vest, tie; `hats`, `bags`, `vests`, `ties` their palettes (empty: defaults).

[density]
max = 60                  # hard cap on people around the player
radius = 120.0            # kept within this of the player
spawn = [60.0, 115.0]     # appear this far away, out of view
despawn = 150.0           # leave when farther than this and out of view
night = 0.35              # share of the day's crowd still out at 03:00
# Crowd by zone, as a share of `max` (zones not listed: 0.3).
zones = { downtown = 1.0, commercial = 0.85, beach = 0.8, park = 0.6, residential = 0.4, hills = 0.2, industrial = 0.2, docks = 0.2, corridor = 0.3, wild = 0.05, shops = 0.9, lot = 0.4, missions = 0.5, range = 0.2, pad = 0.1, yard = 0.2 }

# Everyone in the game is built on these proportions (metres; heights and builds then vary
# them): believable ones (PLAN.md §5.11), a smaller head on a longer neck and longer legs than
# the engine's default biped, standing 1.72 m before each person's height.
[body]
head_radius = 0.13
neck = 0.12
torso_length = 0.47
torso_radius = 0.165
shoulder_width = 0.21
hip_width = 0.1
leg_length = 0.9
arm_length = 0.62
limb_radius = 0.065
eyes_to_camera = 0.3

# SPPD officers on foot: dark navy uniforms, a cap and a badge (the service pistol comes from
# weapons.toml).
[police]
skin = ["#f1c9a5", "#e0ac83", "#c68a62", "#8d5a3b", "#6b4428"]
shirt = "#1d2b4f"
pants = "#141a2b"
shoes = "#0d0d0f"
height = [1.68, 1.92]
build = [1.0, 1.2]
wear.hair = { short = 3, buzz = 2.5, bald = 0.6, bun = 0.8, ponytail = 0.5 }
wear.beard = { mustache = 0.12, stubble = 0.06 }
wear.accessories = { ballcap = 1.0, sunglasses = 0.3, badge = 1.0 }
wear.hats = ["#16203a"]

