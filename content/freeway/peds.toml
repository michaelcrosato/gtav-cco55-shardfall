# Pedestrians (PLAN.md §5.6.7): who walks Paloma Bay, how they look and move, where and when.
# A look is drawn from the archetype's palettes and proportions (each archetype gives dozens of
# distinct people); walks and idles are motion clips (the `clips` tool lists them); `pace` is the
# walking speed in m/s; `zones` lists where an archetype appears (empty: everywhere).

[density]
max = 60                  # hard cap on people around the player
radius = 120.0            # kept within this of the player
spawn = [60.0, 115.0]     # appear this far away, out of view
despawn = 150.0           # leave when farther than this and out of view
night = 0.35              # share of the day's crowd still out at 03:00
# Crowd by zone, as a share of `max` (zones not listed: 0.3).
zones = { downtown = 1.0, commercial = 0.85, beach = 0.8, park = 0.6, residential = 0.4, hills = 0.2, industrial = 0.2, docks = 0.2, corridor = 0.3, wild = 0.05, shops = 0.9, lot = 0.4, missions = 0.5, range = 0.2, pad = 0.1, yard = 0.2 }

