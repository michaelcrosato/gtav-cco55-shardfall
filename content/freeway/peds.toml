# Scenario points (PLAN.md §5.6.7): the dressing props people stop at for a while, now and then
# instead of walking on. `prop` is the end of the prop's library name; they stand or sit `ahead`
# metres in front of it (its +z), at `seats` places `spread` metres apart across it, facing it
# (`face`) or its way (a bench's seat); `clips` is what they do there (one picked), `stay` how
# long (s).
[[scenario]]
prop = "bench"
ahead = 0.25
seats = 3
spread = 0.6
clips = ["MESH2MOTION/Sitting_Idle", "MESH2MOTION/Sitting_Talking"]
stay = [10.0, 25.0]

[[scenario]]
prop = "food_stall"
ahead = 1.3
seats = 2
spread = 0.9
face = true
clips = ["MESH2MOTION/Consume", "MESH2MOTION/Idle_Talking", "MESH2MOTION/Idle_A"]
stay = [6.0, 14.0]

