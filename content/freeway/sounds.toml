# Grand Theft Freeway-BX's sound cues, over the engine's default bank
# (crates/pav_audio/src/default_bank.toml documents the format). Every sound is synthesized.

# The weapon wheel: a soft tick per slot, a heavier clack on choosing.
[cue."wheel.slot"]
layers = [{ wave = "square", freq = 1760, decay = 0.025, volume = 0.035, duty = 0.2, cutoff = 5000 }]
voices = 2

[cue."wheel.pick"]
layers = [
    { wave = "noise", freq = 1, decay = 0.05, volume = 0.12, cutoff = 3000, cutoff_end = 600 },
    { wave = "square", freq = 330, freq_end = 220, glide = 0.05, decay = 0.07, volume = 0.06, duty = 0.35, cutoff = 2400 },
]

# The phone: a notification blip and the classic two-tone ring.
[cue."phone.text"]
layers = [
    { wave = "sine", freq = 1318.5, decay = 0.09, volume = 0.07 },
    { wave = "sine", freq = 1975.5, decay = 0.14, volume = 0.06, delay = 0.08 },
]

[cue."phone.ring"]
layers = [
    { wave = "triangle", freq = 1046.5, decay = 0.25, sustain = 0.6, hold = 0.25, release = 0.05, volume = 0.07 },
    { wave = "triangle", freq = 1318.5, decay = 0.25, sustain = 0.6, hold = 0.25, release = 0.05, volume = 0.06, delay = 0.03 },
]

# Weather: thunder after a lightning flash (rumbling filtered noise, a crack when close).
[cue."weather.thunder"]
layers = [
    { wave = "noise", freq = 1, attack = 0.02, decay = 2.6, volume = 0.5, cutoff = 900, cutoff_end = 90 },
    { wave = "noise", freq = 1, decay = 0.25, volume = 0.25, cutoff = 3500, cutoff_end = 600 },
    { wave = "sine", freq = 48, freq_end = 34, glide = 1.5, attack = 0.05, decay = 2.0, volume = 0.3 },
]
voices = 2

# Guns: a crack (noise through a falling filter), a body (low sine thump), a tail; bigger guns
# lower and longer.
[cue."gun.pistol"]
layers = [
    { wave = "noise", freq = 1, decay = 0.09, volume = 0.5, cutoff = 6000, cutoff_end = 900 },
    { wave = "sine", freq = 180, freq_end = 60, glide = 0.06, decay = 0.08, volume = 0.35 },
    { wave = "noise", freq = 1, attack = 0.01, decay = 0.35, volume = 0.12, cutoff = 1200, cutoff_end = 200, delay = 0.02 },
]
voices = 6

[cue."gun.smg"]
layers = [
    { wave = "noise", freq = 1, decay = 0.06, volume = 0.42, cutoff = 7000, cutoff_end = 1200 },
    { wave = "sine", freq = 210, freq_end = 80, glide = 0.04, decay = 0.05, volume = 0.28 },
]
voices = 8

[cue."gun.shotgun"]
layers = [
    { wave = "noise", freq = 1, decay = 0.18, volume = 0.65, cutoff = 4500, cutoff_end = 300 },
    { wave = "sine", freq = 110, freq_end = 40, glide = 0.12, decay = 0.2, volume = 0.5 },
    { wave = "noise", freq = 1, attack = 0.02, decay = 0.6, volume = 0.15, cutoff = 900, cutoff_end = 120, delay = 0.03 },
]
voices = 4

[cue."gun.rifle"]
layers = [
    { wave = "noise", freq = 1, decay = 0.08, volume = 0.5, cutoff = 8000, cutoff_end = 1000 },
    { wave = "sine", freq = 160, freq_end = 55, glide = 0.05, decay = 0.07, volume = 0.32 },
    { wave = "noise", freq = 1, attack = 0.01, decay = 0.25, volume = 0.1, cutoff = 1500, cutoff_end = 250, delay = 0.015 },
]
voices = 8

[cue."gun.sniper"]
layers = [
    { wave = "noise", freq = 1, decay = 0.14, volume = 0.6, cutoff = 9000, cutoff_end = 700 },
    { wave = "sine", freq = 120, freq_end = 40, glide = 0.1, decay = 0.14, volume = 0.45 },
    { wave = "noise", freq = 1, attack = 0.03, decay = 1.1, volume = 0.18, cutoff = 1000, cutoff_end = 90, delay = 0.04 },
]
voices = 3

[cue."gun.reload"]
layers = [
    { wave = "square", freq = 900, decay = 0.02, volume = 0.06, duty = 0.15, cutoff = 4000 },
    { wave = "square", freq = 600, decay = 0.03, volume = 0.07, duty = 0.2, cutoff = 3000, delay = 0.35 },
    { wave = "noise", freq = 1, decay = 0.04, volume = 0.1, cutoff = 5000, cutoff_end = 2000, delay = 0.7 },
]

[cue."gun.empty"]
layers = [{ wave = "square", freq = 1200, decay = 0.015, volume = 0.05, duty = 0.1, cutoff = 5000 }]

# Shots striking things: a short tick on hard surfaces, a soft thud on people.
[cue."bullet.wall"]
layers = [{ wave = "noise", freq = 1, decay = 0.05, volume = 0.12, cutoff = 7000, cutoff_end = 2500 }]
voices = 6

[cue."bullet.body"]
layers = [{ wave = "sine", freq = 140, freq_end = 70, glide = 0.05, decay = 0.07, volume = 0.18 }, { wave = "noise", freq = 1, decay = 0.04, volume = 0.08, cutoff = 900 }]
voices = 4

# Melee: the swing's whoosh and the punch landing.
[cue."melee.swing"]
layers = [{ wave = "noise", freq = 1, attack = 0.03, decay = 0.12, volume = 0.1, cutoff = 1800, cutoff_end = 600 }]

[cue."melee.hit"]
layers = [
    { wave = "sine", freq = 120, freq_end = 55, glide = 0.06, decay = 0.09, volume = 0.4 },
    { wave = "noise", freq = 1, decay = 0.05, volume = 0.18, cutoff = 2500, cutoff_end = 500 },
]

[cue."grenade.throw"]
layers = [{ wave = "noise", freq = 1, attack = 0.04, decay = 0.15, volume = 0.08, cutoff = 1500, cutoff_end = 400 }]

# Vehicles: a door's latch clicking open, and its heavier thunk shut.
[cue."car.door_open"]
layers = [
    { wave = "noise", freq = 1, decay = 0.04, volume = 0.12, cutoff = 4000, cutoff_end = 1500 },
    { wave = "square", freq = 900, freq_end = 600, glide = 0.02, decay = 0.03, volume = 0.03, duty = 0.3, cutoff = 3000 },
]

[cue."car.door_close"]
layers = [
    { wave = "sine", freq = 95, freq_end = 55, glide = 0.05, decay = 0.11, volume = 0.45 },
    { wave = "noise", freq = 1, decay = 0.07, volume = 0.2, cutoff = 1600, cutoff_end = 300 },
]
