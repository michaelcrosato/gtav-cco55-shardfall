# Grand Theft Freeway-BX's sound cues, over the engine's default bank
# (crates/pav_audio/src/default_bank.toml documents the format). Every sound is synthesized.

# The weapon wheel: a soft tick per slot, a heavier clack on choosing.
[cue."wheel.slot"]
layers = [{ wave = "square", freq = 1760, decay = 0.025, volume = 0.035, duty = 0.2, cutoff = 5000 }]
voices = 2

[cue."wheel.pick"]
layers = [
    { wave = "noise", freq = 1, decay = 0.05, volume = 0.12, cutoff = 3000, cutoff_end = 600 },
    { wave = "square", freq = 330, freq_end = 220, glide = 0.05, decay = 0.07, volume = 0.06, duty = 0.35, cutoff = 2400 },
]

# The phone: a notification blip and the classic two-tone ring.
[cue."phone.text"]
layers = [
    { wave = "sine", freq = 1318.5, decay = 0.09, volume = 0.07 },
    { wave = "sine", freq = 1975.5, decay = 0.14, volume = 0.06, delay = 0.08 },
]

[cue."phone.ring"]
layers = [
    { wave = "triangle", freq = 1046.5, decay = 0.25, sustain = 0.6, hold = 0.25, release = 0.05, volume = 0.07 },
    { wave = "triangle", freq = 1318.5, decay = 0.25, sustain = 0.6, hold = 0.25, release = 0.05, volume = 0.06, delay = 0.03 },
]

# Weather: thunder after a lightning flash (rumbling filtered noise, a crack when close).
[cue."weather.thunder"]
layers = [
    { wave = "noise", freq = 1, attack = 0.02, decay = 2.6, volume = 0.5, cutoff = 900, cutoff_end = 90 },
    { wave = "noise", freq = 1, decay = 0.25, volume = 0.25, cutoff = 3500, cutoff_end = 600 },
    { wave = "sine", freq = 48, freq_end = 34, glide = 1.5, attack = 0.05, decay = 2.0, volume = 0.3 },
]
voices = 2
