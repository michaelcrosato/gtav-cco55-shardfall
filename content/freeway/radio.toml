# Radio stations (PLAN.md §5.6.13, §5.12). Each station's songs come from its seed, one per `slot`
# seconds of air (the song, then the station ident), and every station runs on the game clock, so
# they are live: tuning in lands mid-song, as in the source. `genre` picks the music renderer's
# groove and instruments; the words make song titles and artist names.

[[station]]
id = "freeway_fm"
name = "Freeway FM"
freq = "104.04"
genre = "synthwave"
bpm = [95.0, 118.0]
seed = 10404
