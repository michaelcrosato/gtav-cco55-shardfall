# Radio stations (PLAN.md §5.6.13, §5.12). Each station's songs come from its seed, one per `slot`
# seconds of air (the song, then the station's ident), and every station runs on the radio's
# clock, so they are live: tuning in lands mid-song, as in the source. `genre` picks the music
# renderer's kit, feel and instruments (synthwave, boombap, surf, cumbia, smooth; talk has no
# songs); the words make song titles and artist names. The dial card reads "<NAME> <freq>".

[[station]]
id = "freeway_fm"
name = "Freeway FM"
freq = "104.04"
genre = "synthwave"
bpm = [95.0, 118.0]
seed = 10404
dj = "Tarmac Tina"
title_words = ["Freeway", "Dreams", "Neon", "Sunset", "Overdrive", "Midnight", "Chrome", "Boulevard", "Pacific", "Heat", "Mirage", "Signal", "Coastline", "Velocity", "Afterglow", "Exit"]
