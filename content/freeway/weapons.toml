# Weapons (PLAN.md §5.6.4), in the weapon wheel's order (`icon` matches the wheel's slots).
# Guns are hitscan: `damage` per pellet, `rpm` rounds a minute, `spread` degrees at rest, `bloom`
# degrees each shot adds (it recovers), `recoil` radians of camera kick, `reload` seconds, `head`
# the head-shot multiplier, `knockback` m/s given to people hit. Melee weapons play `combo` clips,
# one a swing, and hit within `range` metres.

