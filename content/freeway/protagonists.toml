# The three protagonists (PLAN.md §5.4), read by `gtf_game::protagonists`. Each keeps their own
# cash, weapons, stats, health, ability meter and whereabouts; the player switches between them
# with the switch wheel (hold D-pad down). `weapons` are weapons.toml ids owned at the start
# (fists and the phone always); `stats` run 0-100 (stamina lengthens the sprint, shooting
# steadies the aim, strength hardens the fists, stealth quietens the crouch). `home` and the
# `life` spots are mission anchors (`spot:<name>` from the district file): where the protagonist
# is found when the player switches to them, busy with something (`clip`, `text` on the switch
# card) in the hours given. `voice` pitches their babble.

[[protagonist]]
key = "dez"
name = "Dez Ortega"
short = "DEZ"
letter = "D"
color = "#6fe28a"
ability = "slipstream"
cash = 350
weapons = ["p9"]
stats = { driving = 72, shooting = 38, stamina = 55, strength = 40, stealth = 45 }
vehicle = "bravura_stallion"
voice = 1.12
home = "spot:dez_home"
look = { skin = "#c68a62", shirt = "#f2f2ee", pants = "#3b5a8c", shoes = "#ededed", cap = "#1f2a44", scale = 0.98, build = 0.9 }

[[protagonist.life]]
at = "spot:dez_home"
clip = "MESH2MOTION/Idle_TalkingPhone"
text = "Dez is on the phone to his cousin about the lowrider."
hours = [8.0, 23.0]

