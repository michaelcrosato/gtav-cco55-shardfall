# The special abilities (L3 + R3): they last up to `seconds` with a full meter, drain while on
# and refill by play style (`fill`: meter per event or per second of it). `time_scale` slows the
# world, `grip` adds tyre grip, `assist` widens the aim assist's cone, `damage` multiplies
# damage dealt, `taken` damage taken, `knockback` the fists' shove; `tint` washes the screen
# (linear RGB and strength). `on_foot` / `in_car`: where it works.
[ability.slipstream]
name = "Slipstream"
seconds = 10.0
time_scale = 0.5
grip = 0.4
in_car = true
tint = [0.25, 1.0, 0.55, 0.22]
fill = { near_miss = 0.06, drift = 0.03, air = 0.08 }

[ability.deadeye]
name = "Deadeye"
seconds = 10.0
time_scale = 0.35
assist = 2.0
damage = 1.5
on_foot = true
tint = [0.3, 0.55, 1.0, 0.24]
fill = { headshot = 0.12, kill = 0.06, takedown = 0.15 }

[ability.overdrive]
name = "Overdrive"
seconds = 10.0
damage = 2.0
taken = 0.5
knockback = 2.0
on_foot = true
in_car = true
tint = [1.0, 0.12, 0.1, 0.26]
fill = { dealt = 0.004, taken = 0.004, explosion = 0.12 }
